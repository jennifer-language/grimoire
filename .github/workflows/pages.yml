#
# Build Grimoire's own documentation with Grimoire and publish it to GitHub
# Pages, PDF included - from the latest release, so the manual a reader finds
# describes the version they can install. A pull request builds and checks the
# book but never publishes.
#
# The work is `docs-pages.yml`, the reusable workflow other repositories call
# too; this file is Grimoire's own call to it, and the checks only Grimoire's
# manual needs.
#
# Published on a release tag, not on every push to main: between releases the
# manual on the site stays the released one. A documentation fix on main reaches
# the site with the next release.
name: pages

on:
  push:
    # Plain semver and nothing else, the shape every release here is tagged in.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  # Republishes the latest release: after a Pages outage, or a change to the
  # custom domain.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    # Publishes to GitHub; skipped on the project's Forgejo, which runs this too.
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      # Grimoire builds its own manual with its own launcher, at the revision
      # being published, rather than with the Grimoire image: the image is
      # whatever was last pushed, and the manual should be rendered by the code
      # it describes.
      #
      # Pinned, unlike `test.yml`. This job republishes an older release as
      # well as a new one, and an interpreter that moved underneath it - the
      # 0.25 development builds changed how quotes are escaped and how strictly
      # XML namespaces are read - would fail a build that passed when the
      # release was tagged. Raise it deliberately, when a release needs it.
      image: ghcr.io/jennifer-language/jennifer:0.25.0
      launcher: bin/grimoire
      args: --pdf
      # The pieces a reader needs, so a silently empty publish fails here
      # instead of on the live site.
      #
      # No unit tests. `test.yml` runs them on the tag when it is pushed, and
      # running them again here would test a different thing: this job also
      # republishes an older release, against an interpreter image that has
      # moved since, and a release whose tests passed when it was tagged would
      # then refuse to publish because the interpreter changed - which is not
      # something its documentation could fix.
      #
      # The PDF is checked by name because docs/index.md links to it. CNAME is
      # checked because this deploys from an artifact rather than a branch - the
      # published site is only what is in the tarball, so a missing CNAME
      # silently unbinds the custom domain. The sitemap comes from a renderer,
      # so finding it also asserts that the plugin ran.
      check: |
        test -f "$SITE/assets/grimoire.css"
        test -f "$SITE/assets/search-index.js"
        test -s "$SITE/grimoire.pdf"
        grep -q 'href="grimoire.pdf"' "$SITE/index.html"
        test "$(cat "$SITE/CNAME")" = "grimoire.jennifer-lang.dev"
        test -f "$SITE/sitemap.xml"
        test -f "$SITE/robots.txt"
        grep -q 'https://grimoire.jennifer-lang.dev/index.html' "$SITE/sitemap.xml"
