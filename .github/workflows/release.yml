#
# Publish a GitHub Release for a `v*` tag.
#
# The body is `packaging/OVERVIEW.md` - a blurb of a few lines - with the parts
# that only make sense for one tag generated on top of it: how to get this
# version, and what changed since the last one. A release page is read by someone
# deciding whether to install this version, not by someone learning what the
# project is, so anything that reads like a second README belongs in the README.
# The package page carries its own one-sentence description, capped at 512
# characters by the registry; that one lives in `docker.yml`.
#
# Nothing is built here. The site publishes from `pages.yml` and the image from
# `docker.yml`, both of which already run on a tag; this job waits for neither,
# because a release that failed to appear is easier to notice than one that
# appeared with the wrong notes.
#
# It does wait for one thing, in `version.yml`: that the tag being released and
# the version in the files are the same number. That is the one error a release
# cannot absorb, since the tag it names is also what the registry publishes from
# and what the image is called.

name: release

on:
  push:
    # Both spellings. Everything downstream strips a leading `v` - the release
    # notes, the image tags, the check in `version.yml` - and the tag actually pushed
    # here, `0.1.0`, carries none, so `v*` alone would have run nothing at all
    # on it.
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the existing tag to release
        required: true

permissions:
  contents: write

jobs:
  # Before anything is published, and this is the workflow that most needs it.
  # A release is the copy of the version number that cannot be corrected in
  # place: the tag it points at is what the registry publishes from and what the
  # image is named after. `test.yml` checks the same thing, but it is a separate
  # workflow started by the same push, so it finishes well after this one would
  # have created the release. Calling the check here is what makes it a gate.
  #
  # The dispatch input is passed along: a release composed for a tag by hand has
  # to compare the files at *that* tag, not the ones on the branch this run
  # started from.
  version:
    uses: ./.github/workflows/version.yml
    with:
      tag: ${{ github.event.inputs.tag || '' }}

  release:
    needs: version
    runs-on: ubuntu-latest

    steps:
      # Full history and tags: the changelog below asks git what happened since
      # the previous tag, and a shallow clone knows about neither.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Compose the release notes
        id: notes
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)

          {
            cat packaging/OVERVIEW.md
            echo
            echo "## This release"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/jennifer-language/grimoire:$version"
            echo '```'
            echo
            echo "Or a checkout at this tag, which needs only a Jennifer interpreter:"
            echo
            echo '```sh'
            echo "git clone --branch $tag https://github.com/jennifer-language/grimoire"
            echo "cd grimoire && bin/grimoire build"
            echo '```'
            if [ -n "$previous" ]; then
              echo
              echo "## Changes since $previous"
              echo
              git log --no-merges --pretty='- %s' "$previous..$tag"
              echo
              echo "[Full diff](https://github.com/jennifer-language/grimoire/compare/$previous...$tag)"
            fi
          } > notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "--- notes.md ---"
          cat notes.md

      # `--verify-tag` so a mistyped dispatch input fails here rather than
      # creating a release pointing at a tag that does not exist.
      #
      # An existing release is edited rather than refused. A tag pushed before
      # this workflow existed already has a release with whatever notes GitHub
      # generated, and `workflow_dispatch` above is how it gets these ones
      # instead; a `create` that fails on "already exists" would make that the
      # one case the workflow cannot fix.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${{ steps.notes.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "the release exists; replacing its notes"
            gh release edit "$tag" \
              --title "Grimoire $tag" \
              --notes-file notes.md
          else
            gh release create "$tag" \
              --title "Grimoire $tag" \
              --notes-file notes.md \
              --verify-tag
          fi
