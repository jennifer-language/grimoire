#
# The demo book for grimoire-apiref. Build it from this directory:
#
#   grimoire build
#
# The reference chapter is written from the docblocks in `src/`, on every build.
#
# The table below names the plugin and nothing else: it ships with Grimoire,
# which looks for `grimoire-apiref` beside itself before it looks anywhere else.
# Nothing has to be installed, and nothing is enabled that a book does not ask
# for by name.

[book]
title = "Geometry"
description = "A tiny library, documented by its own docblocks."
authors = ["mplx"]
language = "en"

[build]
src = "docs"
out = "site"

[preprocessor.apiref]
depth = 2
