#
# The gate every change goes through: formatting, lint, the repository's own
# punctuation rule, the unit tests, and then a real book built end to end.
#
# Everything runs inside the official Jennifer image rather than installing an
# interpreter on the runner, the same way `pages.yml` does. That is one fewer
# thing to keep in step, and it means the pipeline is exercising the interpreter
# a reader would actually get.
#
# Two jobs rather than one, because they fail for different reasons and the split
# says which: `unit` is Grimoire's own code being wrong, `book` is Grimoire's
# output being wrong.

name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Grimoire's sources require Jennifer 0.25.0, and the `latest` image is still
  # 0.24.0. Switch this to `latest` the day 0.25.0 is released - the same line
  # lives in `Dockerfile` and `pages.yml`.
  JENNIFER_TAG: dev

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Pull once and name it once; every step below is the same invocation.
      - name: Pull the interpreter image
        run: docker pull "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}"

      # `--check` names the unformatted files and exits non-zero without
      # rewriting one, which is what a pipeline wants: a formatting fix belongs
      # in the commit that needed it, not in a bot's.
      - name: Check formatting
        run: |
          docker run --rm -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            fmt --check bin/grimoire src/*.j src/themes/*.j scripts/*.j

      - name: Lint
        run: |
          docker run --rm -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            lint bin/grimoire src/*.j src/themes/*.j scripts/*.j

      # The repository writes ASCII punctuation everywhere, for two reasons: a
      # typographic character is invisible in a diff, and the printable build
      # encodes WinAnsi so every one of them is a transliteration away from the
      # page. `src/pdfbook.j` holds the transliteration table and `src/locale.j`
      # holds eleven languages, so both are exempt from the grep - `locale.j` is
      # checked by `src/locale_test.j` instead, which bans the punctuation while
      # allowing the letters.
      #
      # Two lines are expected: the example in `docs/internals.md` and the
      # `authorsLabel` in `grimoire.toml`, both of which are the character as
      # content rather than as punctuation.
      # The count is checked as well as the files, so that a *second* such
      # character sneaking into one of the two sanctioned files is caught too.
      - name: Check for non-ASCII punctuation
        run: |
          set -eu
          found=$(grep -rnP '[^\x00-\x7F]' \
            --include='*.j' --include='*.md' --include='*.toml' \
            --include='*.sh' --include='*.yml' . \
            | grep -Ev 'src/(pdfbook|locale)\.j' || true)
          unexpected=$(printf '%s\n' "$found" \
            | grep -Ev '^\./(docs/internals\.md|grimoire\.toml):' | grep -c . || true)
          total=$(printf '%s\n' "$found" | grep -c . || true)
          if [ "$unexpected" -ne 0 ] || [ "$total" -ne 2 ]; then
            echo "expected exactly the two sanctioned lines, got $total:"
            echo "$found"
            exit 1
          fi
          echo "$found"

      # The deck specification decides the layout, and the layout is the kind of
      # thing that is correct until somebody tidies it. `src/` is the tree a
      # consumer vendors, so it holds modules and nothing else, and the entry
      # module is named after the deck.
      #
      # There is no shorter alias at the repository root to check for. One lived
      # there briefly and could not be kept: the filesystem this project is
      # developed on cannot store a symlink, so every commit made there dropped
      # it. `bin/grimoire` is the only path, and everything types it.
      - name: Check the deck layout
        run: |
          set -u
          fail=0
          # Every assertion says what it looked at and what it wanted. A bare
          # `test` under `set -e` fails the job with no output at all, which
          # turns a one-line problem into a round trip through the logs.
          check() {
            if eval "$2"; then
              echo "ok    $1"
            else
              echo "FAIL  $1"
              printf '      %s\n' "$3"
              fail=1
            fi
          }

          check "deck.toml exists" \
            '[ -f deck.toml ]' \
            "the manifest is what publishes this deck"
          check "src/grimoire.j is the entry module" \
            '[ -f src/grimoire.j ]' \
            "the deck specification names it after the deck"
          check "bin/grimoire is executable" \
            '[ -x bin/grimoire ]' \
            "git tracks the mode; run: chmod +x bin/grimoire && git add bin/grimoire"
          # Static properties only. This step is plain shell on the runner, which
          # has no interpreter - every other step reaches Jennifer through
          # `docker run`. Whether the launcher actually *starts* is answered
          # twice over by steps that can answer it: `lint` parses it, and the
          # `book` job below builds a whole manual with it.
          check "bin/grimoire is a Jennifer program" \
            'head -1 bin/grimoire | grep -q "^#!.*jennifer"' \
            "the launcher lost its shebang"
          check "bin/grimoire imports the entry module" \
            'grep -q "^import \"\.\./src/grimoire\.j\"" bin/grimoire' \
            "the launcher must import ../src/grimoire.j - one level up, out of bin/"
          # A launcher inside src/ would be vendored into consumers along with
          # the modules, which is exactly what bin/ exists to prevent.
          check "src/ holds modules only" \
            '! grep -rlq "^#!" src/' \
            "something under src/ has a shebang; a program belongs in bin/"

          # The registry requires the manifest version to match the tag a
          # release is published from, and `--version` is what a reader checks
          # against it. Two copies of one number, in files that are edited for
          # unrelated reasons.
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' deck.toml)
          program=$(sed -n 's/.*VERSION as string init "grimoire \(.*\)".*/\1/p' src/grimoire.j)
          if [ -z "$manifest" ] || [ -z "$program" ]; then
            echo "FAIL  a version could not be read"
            printf '      deck.toml: %s\n' "${manifest:-<none>}"
            printf '      src/grimoire.j: %s\n' "${program:-<none>}"
            fail=1
          elif [ "$manifest" != "$program" ]; then
            echo "FAIL  version drift"
            printf '      deck.toml says %s, src/grimoire.j says %s\n' "$manifest" "$program"
            fail=1
          else
            echo "ok    version $manifest in both places"
          fi

          exit "$fail"

      # The package page shows `org.opencontainers.image.description`, and falls
      # back to the whole repository README when it is empty. `docker.yml` states
      # it so that cannot happen, and the `Dockerfile` repeats it so a build by
      # hand produces the same image - two copies of one sentence, which is
      # exactly the arrangement that drifts. Nothing else would notice.
      - name: Check the image description has not drifted
        run: |
          set -eu
          dockerfile=$(sed -n 's/.*org\.opencontainers\.image\.description="\(.*\)".*/\1/p' Dockerfile)
          workflow=$(sed -n 's/^ *org\.opencontainers\.image\.description=//p' \
            .github/workflows/docker.yml)
          test -n "$dockerfile"
          if [ "$dockerfile" != "$workflow" ]; then
            echo "the image description differs between Dockerfile and docker.yml:"
            echo "  Dockerfile: $dockerfile"
            echo "  docker.yml: $workflow"
            exit 1
          fi
          test -s packaging/OVERVIEW.md

      # `scripts/test.sh` splits JENNIFER on whitespace precisely so it can be a
      # whole command, which is what lets the loop run on the runner while every
      # test runs in the image.
      - name: Unit tests
        run: |
          JENNIFER="docker run --rm -v $PWD:/work ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            scripts/test.sh

  book:
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Pull the interpreter image
        run: docker pull "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}"

      # Twice, at two job counts, into two directories. Byte-identical output at
      # any `--jobs` is a promise Grimoire makes and an easy one to break by
      # accident: anything that accumulates across chapters has to be reassembled
      # in outline order rather than in the order the workers finish.
      #
      # The PDF is included because it is the piece most likely to go wrong here -
      # it runs alongside the chapter render rather than after it.
      - name: Build the manual twice
        run: |
          set -eux
          run() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
              "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
              run bin/grimoire build --pdf "$@"
          }
          run --out /work/out-j1 --jobs 1 --quiet
          run --out /work/out-j7 --jobs 7 --quiet

      - name: Check the output is byte-identical
        run: diff -r out-j1 out-j7

      - name: Check the pieces a reader needs
        run: |
          set -eux
          test -s out-j1/index.html
          test -s out-j1/grimoire.pdf
          test -s out-j1/assets/grimoire.css
          test -s out-j1/assets/grimoire.js
          test -s out-j1/assets/search-index.js

      # A build reports a missing *chapter* but not a broken cross-reference, so
      # the one thing a Grimoire build cannot tell you about itself is checked
      # here. Every local href, and every fragment it points at.
      #
      # `<code>` spans come out first. A page that documents an `href` - this
      # manual does, in the configuration chapter - puts the literal string in
      # the output, where it looks exactly like a link to a file called `...`.
      - name: Check every link and fragment
        run: |
          set -eu
          cd out-j1
          dead=$(for f in *.html; do
            sed 's|<code>[^<]*</code>||g' "$f" |
            grep -oh 'href="[^"]*"' | sed 's|href="||;s|"$||' | grep -v '^http' |
            while read -r l; do
              t="${l%%#*}"; frag="${l#*#}"; tf="${t:-$f}"
              [ -z "$t" ] || [ -f "$t" ] || echo "DEAD FILE: $f -> $l"
              case "$l" in *#*) grep -q "id=\"$frag\"" "$tf" || echo "DEAD FRAG: $f -> $l";; esac
            done
          done | sort -u)
          if [ -n "$dead" ]; then
            echo "$dead"
            exit 1
          fi
          echo "no dead links"

      # `--clean` end to end. The unit tests cover `prune` thoroughly, but this is
      # the only thing Grimoire does that a second run will not undo, so it is
      # worth one assertion through the real command line: the stale chapter goes,
      # the dotfile stays.
      - name: Check that --clean prunes, and what it spares
        run: |
          set -eux
          touch out-j1/stale-chapter.html out-j1/.nojekyll
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run bin/grimoire build --out /work/out-j1 --clean --quiet
          test ! -e out-j1/stale-chapter.html
          test -f out-j1/.nojekyll
          test -s out-j1/index.html

      # And that it refuses the configuration that would delete the book. A
      # non-zero status with the sources still there is the whole contract.
      - name: Check that --clean refuses to empty the sources
        run: |
          set -eu
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run bin/grimoire build --src docs --out . --clean --quiet; then
            echo "expected the build to refuse, but it succeeded"
            exit 1
          fi
          test -f docs/index.md
          test -f grimoire.toml

      # The nine arrangements of the two navigation columns, since eight of them
      # are never exercised by the build above.
      - name: Build every column arrangement
        run: |
          set -eux
          for nav in left right off; do
            for toc in left right off; do
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
                "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
                run bin/grimoire build --nav "$nav" --toc "$toc" \
                  --out "/work/out-$nav-$toc" --quiet
              grep -q "data-nav=\"$nav\" data-toc=\"$toc\"" "out-$nav-$toc/index.html"
            done
          done
