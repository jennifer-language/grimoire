#
# The gate every change goes through: formatting, lint, the repository's own
# punctuation rule, the unit tests, and then a real book built end to end.
#
# Everything runs inside the official Jennifer image rather than installing an
# interpreter on the runner, the same way `pages.yml` does. That is one fewer
# thing to keep in step, and it means the pipeline is exercising the interpreter
# a reader would actually get.
#
# Three jobs rather than one, because they fail for different reasons and the
# split says which: `version` is a number that drifted, `unit` is Grimoire's own
# code being wrong, `book` is Grimoire's output being wrong. The first of them
# lives in its own file so that the workflows which publish can call it too, and
# wait for it - see `.github/workflows/version.yml`.

name: test

on:
  push:
    branches: [main]
    # Both spellings. Everything downstream strips a leading `v` - the release
    # notes, the image tags, the check in `version.yml` - and the tag actually pushed
    # here, `0.1.0`, carries none, so `v*` alone would have run nothing at all
    # on it.
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Grimoire's sources require Jennifer 0.25.0, and the `latest` image is still
  # 0.24.0. Switch this to `latest` the day 0.25.0 is released - the same line
  # lives in `Dockerfile` and `pages.yml`.
  JENNIFER_TAG: dev

jobs:
  # The version numbers, as their own callable workflow. It used to be a block
  # inside the deck-layout step below, which read correctly and gated nothing: a
  # tag push starts this workflow, `release.yml` and `docker.yml` at the same
  # moment, so by the time a drifting version fails here the release is
  # published and the image is pushed. Both of those now call the same workflow
  # first and stop when it fails; this run keeps it too, so a branch or a pull
  # request still catches the drift where it is cheap to fix.
  version:
    uses: ./.github/workflows/version.yml

  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Pull once and name it once; every step below is the same invocation.
      - name: Pull the interpreter image
        run: docker pull "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}"

      # `--check` names the unformatted files and exits non-zero without
      # rewriting one, which is what a pipeline wants: a formatting fix belongs
      # in the commit that needed it, not in a bot's.
      - name: Check formatting
        run: |
          docker run --rm -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            fmt --check bin/grimoire src/*.j src/themes/*.j scripts/*.j \
            plugins/*.j plugins/grimoire-*

      - name: Lint
        run: |
          docker run --rm -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            lint bin/grimoire src/*.j src/themes/*.j scripts/*.j \
            plugins/*.j plugins/grimoire-*

      # Two checks, because the repository has two rules that used to be one
      # grep. `check-style.sh` bans the typographic characters - dashes, curly
      # quotes, ellipsis, arrows, emoji - everywhere, and says nothing about
      # letters, which are never what that rule is about. `check-print.j` asks
      # the other question: would anything in the printable book reach the page
      # as `?`, because the standard-14 fonts encode WinAnsi and no more.
      - name: Check for typographic characters
        run: scripts/check-style.sh

      - name: Check what the printable book can draw
        run: |
          docker run --rm -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run scripts/check-print.j

      - name: Check the deck layout
        run: |
          set -u
          fail=0
          # Every assertion says what it looked at and what it wanted. A bare
          # `test` under `set -e` fails the job with no output at all, which
          # turns a one-line problem into a round trip through the logs.
          check() {
            if eval "$2"; then
              echo "ok    $1"
            else
              echo "FAIL  $1"
              printf '      %s\n' "$3"
              fail=1
            fi
          }

          check "deck.toml exists" \
            '[ -f deck.toml ]' \
            "the manifest is what publishes this deck"
          check "src/grimoire.j is the entry module" \
            '[ -f src/grimoire.j ]' \
            "the deck specification names it after the deck"
          check "bin/grimoire is executable" \
            '[ -x bin/grimoire ]' \
            "git tracks the mode; run: chmod +x bin/grimoire && git add bin/grimoire"
          # Static properties only. This step is plain shell on the runner, which
          # has no interpreter - every other step reaches Jennifer through
          # `docker run`. Whether the launcher actually *starts* is answered
          # twice over by steps that can answer it: `lint` parses it, and the
          # `book` job below builds a whole manual with it.
          check "bin/grimoire is a Jennifer program" \
            'head -1 bin/grimoire | grep -q "^#!.*jennifer"' \
            "the launcher lost its shebang"
          check "bin/grimoire imports the entry module" \
            'grep -q "^import \"\.\./src/grimoire\.j\"" bin/grimoire' \
            "the launcher must import ../src/grimoire.j - one level up, out of bin/"
          # A launcher inside src/ would be vendored into consumers along with
          # the modules, which is exactly what bin/ exists to prevent.
          check "src/ holds modules only" \
            '! grep -rlq "^#!" src/' \
            "something under src/ has a shebang; a program belongs in bin/"
          # The image entrypoint. It reads GRIMOIRE_PLUGINS and then execs the
          # launcher, so a lost execute bit is a container that cannot start at
          # all - and nothing else in this job would notice.
          check "the container entrypoint is executable" \
            '[ -x packaging/docker-entrypoint.sh ]' \
            "git tracks the mode; run: chmod +x packaging/docker-entrypoint.sh"
          check "the container entrypoint ends in the launcher" \
            'grep -q "^exec jennifer run /opt/grimoire/bin/grimoire" packaging/docker-entrypoint.sh' \
            "everything after the image name has to reach Grimoire, as one exec"
          check "the Dockerfile uses it" \
            'grep -q "ENTRYPOINT \[\"/opt/grimoire/bin/docker-entrypoint.sh\"\]" Dockerfile' \
            "the entrypoint script is in the image but nothing runs it"
          check "the build context has a place for third-party plugins" \
            '[ -f plugins-src/README.md ]' \
            "COPY plugins-src fails without it; see plugins-src/README.md"

          exit "$fail"

      # Every plugin that ships: a launcher, the module beside it, its overlay,
      # and a book under examples/ that the job below builds.
      - name: Check the shape of the plugins that ship
        run: scripts/check-plugins.sh

      # In a clone there is nothing but tracked files, so a forgotten `git add`
      # here is a step failing with "No such file or directory" several minutes
      # in. The same check run before a push says which file.
      - name: Check that everything the build needs is tracked
        run: scripts/check-tracked.sh

      # The package page shows `org.opencontainers.image.description`. `docker.yml`
      # holds it once, as an env value, and the `Dockerfile` repeats it so a build
      # by hand produces the same image - two copies of one sentence, which is
      # exactly the arrangement that drifts. Nothing else would notice.
      - name: Check the image description has not drifted
        run: |
          set -eu
          dockerfile=$(sed -n 's/.*org\.opencontainers\.image\.description="\(.*\)".*/\1/p' Dockerfile)
          workflow=$(sed -n 's/^  DESCRIPTION: "\(.*\)"$/\1/p' .github/workflows/docker.yml)
          test -n "$dockerfile"
          test -n "$workflow"
          if [ "$dockerfile" != "$workflow" ]; then
            echo "the image description differs between Dockerfile and docker.yml:"
            echo "  Dockerfile: $dockerfile"
            echo "  docker.yml: $workflow"
            exit 1
          fi

          # And that both inputs use it. A label is written into the image config,
          # an annotation onto the index, and a multi-arch tag *is* an index - so
          # a description that is only a label is one the registry never reads.
          # It went out that way once; the pattern avoids naming the expression
          # syntax, which this script would otherwise have substituted before the
          # shell ever saw it.
          used=$(grep -c 'image\.description=.*env\.DESCRIPTION' \
            .github/workflows/docker.yml || true)
          if [ "$used" -ne 2 ]; then
            echo "expected the description in the labels and the annotations input"
            echo "of docker.yml, found $used reference(s)"
            exit 1
          fi

          test -s packaging/OVERVIEW.md

      # Two shipped plugins date a book from its git history, and their tests
      # build real repositories - `grimoire-feed` and `grimoire-lastmod`. The
      # official interpreter image carries no git, so the suite in it would test
      # the image rather than the plugins: they skip their git half where there is
      # no git, which should be a contributor's laptop and not this job.
      - name: An interpreter image with git
        run: scripts/ci-git-image.sh jennifer-git:test "${JENNIFER_TAG}"

      # `scripts/test.sh` splits JENNIFER on whitespace precisely so it can be a
      # whole command, which is what lets the loop run on the runner while every
      # test runs in the image.
      - name: Unit tests
        run: |
          JENNIFER="docker run --rm -v $PWD:/work jennifer-git:test" \
            scripts/test.sh

  book:
    needs: unit
    runs-on: ubuntu-latest

    steps:
      # Full history, not a shallow clone: `grimoire-feed` and `grimoire-lastmod`
      # date each chapter by the commit that last touched it, and a depth-1
      # checkout has one commit for the whole tree - their examples would then be
      # testing the checkout rather than the plugin.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull the interpreter image
        run: docker pull "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}"

      # For the two examples that read `git log`; see the note in the unit job.
      - name: An interpreter image with git
        run: scripts/ci-git-image.sh jennifer-git:test "${JENNIFER_TAG}"

      # Twice, at two job counts, into two directories. Byte-identical output at
      # any `--jobs` is a promise Grimoire makes and an easy one to break by
      # accident: anything that accumulates across chapters has to be reassembled
      # in outline order rather than in the order the workers finish.
      #
      # The PDF is included because it is the piece most likely to go wrong here -
      # it runs alongside the chapter render rather than after it.
      - name: Build the manual twice
        run: |
          set -eux
          run() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
              "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
              run bin/grimoire build --pdf "$@"
          }
          run --out /work/out-j1 --jobs 1 --quiet
          run --out /work/out-j7 --jobs 7 --quiet

      - name: Check the output is byte-identical
        run: diff -r out-j1 out-j7

      - name: Check the pieces a reader needs
        run: |
          set -eux
          test -s out-j1/index.html
          test -s out-j1/grimoire.pdf
          test -s out-j1/assets/grimoire.css
          test -s out-j1/assets/grimoire.js
          test -s out-j1/assets/search-index.js

      # What a build executes that it did not write. The manual configures the
      # sitemap renderer, so this reports one program, by its real path, and says
      # it ships with Grimoire - which is the answer a reader of somebody else's
      # book needs before they build it.
      - name: Check that the build says what it runs
        run: |
          set -eu
          out=$(docker run --rm -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run bin/grimoire plugins)
          echo "$out"
          echo "$out" | grep -q "renderer  sitemap"
          echo "$out" | grep -q "plugins/grimoire-sitemap"
          echo "$out" | grep -q "(ships with Grimoire)"

      # Each shipped plugin's own book, built by the Grimoire in this checkout.
      # They are small on purpose - one screen each - and they are the only
      # end-to-end coverage the plugins have: the unit tests cover the pieces,
      # and this covers the pipeline around them.
      - name: Build every plugin example
        run: |
          set -eux
          # `IMAGE=` picks the interpreter for one example: `grimoire-feed` and
          # `grimoire-lastmod` date a book from `git log`, and the official image
          # carries no git, so without this their examples would build a book with
          # no feed and no dates and the assertions below would be about the image.
          build() {
            name=$1
            shift
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/work" -w "/work/examples/$name" \
              -e GIT_CONFIG_COUNT=1 \
              -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
              "${IMAGE:-ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}}" \
              run /work/bin/grimoire build "$@"
          }

          build apiref
          grep -q 'id="distance"' examples/apiref/site/reference.html
          ! grep -q 'apiref src' examples/apiref/site/reference.html

          build epub
          unzip -v examples/epub/site/field-guide.epub | grep mimetype | grep -q Stored
          unzip -l examples/epub/site/field-guide.epub | grep -q 'OEBPS/offline.xhtml'

          IMAGE=jennifer-git:test build feed
          grep -q '<rss version="2.0"' examples/feed/site/feed.xml

          build glossary
          grep -q 'href="glossary.html#outline"' examples/glossary/site/index.html
          grep -q 'href="../glossary.html#search-index"' \
            examples/glossary/site/guide/building.html

          IMAGE=jennifer-git:test build lastmod
          grep -q '<em>Last updated: 20' examples/lastmod/site/index.html

          build linkcheck
          test -s examples/linkcheck/site/index.html

          build redirects
          grep -q 'url=../../guide/syntax.html' \
            examples/redirects/site/archive/2024/notes.html

          build include
          # The code on the page is the file on disk, and the page about the
          # syntax still shows the syntax.
          grep -q 'greet("world");' examples/include/site/index.html
          grep -q '{{#include examples/hello.j}}' examples/include/site/syntax.html

          build macros
          grep -q 'version 1.4.0' examples/macros/site/index.html
          # A fence is not expanded, and a backslash prints the macro instead.
          grep -q 'thing --version {{ version }}' examples/macros/site/index.html
          grep -q '{{ book.title }}' examples/macros/site/names.html

          build figure
          grep -q '<em>How a book is built</em>' examples/figure/site/index.html
          grep -q '<em>The same picture, captioned by its alt text</em>' \
            examples/figure/site/index.html

          build emoji
          # The source is ASCII and the page is not: the shortcode is gone and
          # the character is there.
          ! grep -q ':rocket:' examples/emoji/site/index.html
          grep -q "$(printf '\xf0\x9f\x9a\x80')" examples/emoji/site/index.html
          # A colon is punctuation long before it is markup.
          grep -q '10:30' examples/emoji/site/quiet.html
          grep -q 'std::vector' examples/emoji/site/quiet.html
          grep -q ':rocket:' examples/emoji/site/quiet.html

          build sitemap
          grep -q '<loc>https://example.com/manual/guide/deeper.html</loc>' \
            examples/sitemap/site/sitemap.xml
          grep -q 'Sitemap: https://example.com/manual/sitemap.xml' \
            examples/sitemap/site/robots.txt

          # The three XML documents a plugin writes are parsed rather than
          # grepped: well formed is a parser's judgement, and an EPUB reader or a
          # crawler refuses what is not.
          python3 - <<'CHECK'
          import xml.etree.ElementTree as ET, zipfile
          ET.parse("examples/sitemap/site/sitemap.xml")
          ET.parse("examples/feed/site/feed.xml")
          z = zipfile.ZipFile("examples/epub/site/field-guide.epub")
          for n in z.namelist():
              if n.endswith((".xhtml", ".opf", ".xml")):
                  ET.fromstring(z.read(n))
          print("every document parses")
          CHECK

      # The link checker has to be able to fail, or its example proves nothing.
      - name: Check that a dead link fails the build
        run: |
          set -eu
          printf '\nA [dead link](gone.md).\n' >> examples/linkcheck/docs/anchors.md
          if docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work/examples/linkcheck \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run /work/bin/grimoire build --quiet; then
            echo "expected the build to fail on a dead link"
            exit 1
          fi
          git checkout -- examples/linkcheck/docs/anchors.md

      # A build reports a missing *chapter* but not a broken cross-reference, so
      # the one thing a Grimoire build cannot tell you about itself is checked
      # here. Every local href, and every fragment it points at.
      #
      # `<code>` spans come out first. A page that documents an `href` - this
      # manual does, in the configuration chapter - puts the literal string in
      # the output, where it looks exactly like a link to a file called `...`.
      - name: Check every link and fragment
        run: |
          set -eu
          cd out-j1
          dead=$(for f in *.html; do
            sed 's|<code>[^<]*</code>||g' "$f" |
            grep -oh 'href="[^"]*"' | sed 's|href="||;s|"$||' | grep -v '^http' |
            while read -r l; do
              t="${l%%#*}"; frag="${l#*#}"; tf="${t:-$f}"
              [ -z "$t" ] || [ -f "$t" ] || echo "DEAD FILE: $f -> $l"
              case "$l" in *#*) grep -q "id=\"$frag\"" "$tf" || echo "DEAD FRAG: $f -> $l";; esac
            done
          done | sort -u)
          if [ -n "$dead" ]; then
            echo "$dead"
            exit 1
          fi
          echo "no dead links"

      # `--clean` end to end. The unit tests cover `prune` thoroughly, but this is
      # the only thing Grimoire does that a second run will not undo, so it is
      # worth one assertion through the real command line: the stale chapter goes,
      # the dotfile stays.
      - name: Check that --clean prunes, and what it spares
        run: |
          set -eux
          touch out-j1/stale-chapter.html out-j1/.nojekyll
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run bin/grimoire build --out /work/out-j1 --clean --quiet
          test ! -e out-j1/stale-chapter.html
          test -f out-j1/.nojekyll
          test -s out-j1/index.html

      # And that it refuses the configuration that would delete the book. A
      # non-zero status with the sources still there is the whole contract.
      - name: Check that --clean refuses to empty the sources
        run: |
          set -eu
          if docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
            run bin/grimoire build --src docs --out . --clean --quiet; then
            echo "expected the build to refuse, but it succeeded"
            exit 1
          fi
          test -f docs/index.md
          test -f grimoire.toml

      # The nine arrangements of the two navigation columns, since eight of them
      # are never exercised by the build above.
      - name: Build every column arrangement
        run: |
          set -eux
          for nav in left right off; do
            for toc in left right off; do
              docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
                "ghcr.io/jennifer-language/jennifer:${JENNIFER_TAG}" \
                run bin/grimoire build --nav "$nav" --toc "$toc" \
                  --out "/work/out-$nav-$toc" --quiet
              grep -q "data-nav=\"$nav\" data-toc=\"$toc\"" "out-$nav-$toc/index.html"
            done
          done
